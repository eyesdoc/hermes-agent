name: daily-sync-to-gitea

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, nas]
    steps:
      - name: Pull upstream and push to Gitea
        run: |
          set -e
          rm -rf /tmp/hermes-agent-mirror
          git clone --mirror git@github.com:NousResearch/hermes-agent.git /tmp/hermes-agent-mirror
          cd /tmp/hermes-agent-mirror
          GITEA_URL=$(cat /opt/actions-runner/hermes-agent/.gitea_push_url)
          git remote add gitea "$GITEA_URL"
          git push --mirror gitea