name: daily-sync-to-gitea

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, nas]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: NousResearch/hermes-agent
      - name: Push to Gitea
        run: |
          GITEA_URL=$(cat /opt/data/runner/.gitea_push_url)
          git remote add gitea "$GITEA_URL"
          git push --mirror gitea